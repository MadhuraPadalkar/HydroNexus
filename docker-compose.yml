services:
  # ============================================================================
  # OFFICER PORTAL (Internal Municipal Operations)
  # ============================================================================
  officer-portal:
    container_name: hydronexus-officer-portal
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP_NAME: officer-portal
    ports:
      - "${OFFICER_PORT:-5173}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      - VITE_USE_MOCKS=${VITE_USE_MOCKS:-true}
    restart: unless-stopped
    networks:
      - hydronexus-network

  # ============================================================================
  # CITIZEN PORTAL (Citizen Facing Services & Grievances)
  # ============================================================================
  citizen-portal:
    container_name: hydronexus-citizen-portal
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP_NAME: citizen-portal
    ports:
      - "${CITIZEN_PORT:-5174}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      - VITE_USE_MOCKS=${VITE_USE_MOCKS:-true}
    restart: unless-stopped
    networks:
      - hydronexus-network

