components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Authentication token missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [message]
          properties:
            message: { type: string, example: 'Unauthorized access' }
            code: { type: string, example: 'AUTH_UNAUTHORIZED' }
            status: { type: integer, example: 401 }
            details: { type: object }

    WorkOrder:
      type: object
      properties:
        id: { type: string, example: 'WO-2026-001' }
        complaintId: { type: string, example: 'CMP-2024-0891' }
        title: { type: string, example: 'Repair feeder valve 4B — Kasba Bawada' }
        ward: { type: string, example: 'Kasba Bawada' }
        assignedTo: { type: string, example: 'Anil Jadhav' }
        priority: { type: string, enum: [Low, Medium, High, Critical], example: Critical }
        status: { type: string, enum: [Open, In Progress, On Hold, Completed, Cancelled], example: In Progress }
        createdAt: { type: string, example: '11 Sep 2026, 08:10' }
        updatedAt: { type: string, example: '11 Sep 2026, 09:00' }
        notes: { type: string }

    Ward:
      type: object
      properties:
        id: { type: string, example: 'ward-03' }
        name: { type: string, example: 'Kasba Bawada' }
        zone: { type: string, example: 'East' }
        population: { type: integer, example: 14800 }
        households: { type: integer, example: 3400 }
        coveragePct: { type: number, example: 82 }
        supplyHours: { type: string, example: '17:00–20:00' }
        status: { type: string, enum: [Normal, Watch, Disrupted], example: Disrupted }

    DashboardSummary:
      type: object
      properties:
        totalWards: { type: integer, example: 8 }
        activeComplaints: { type: integer, example: 4 }
        criticalComplaints: { type: integer, example: 1 }
        cityNrwPct: { type: number, example: 21.5 }
        activeAlerts: { type: integer, example: 2 }
        citizensServed: { type: integer, example: 3 }
