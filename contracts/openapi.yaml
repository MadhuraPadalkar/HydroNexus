openapi: 3.0.3
info:
  title: HydroNexus Water Management API
  version: 1.0.0
  description: >
    Production-ready REST API specification for the HydroNexus Municipal Water Management System.
    Serves both the Officer Operations Portal (port 5173) and Citizen Portal (port 5174).
servers:
  - url: http://localhost:8000/api/v1
    description: Local development backend server
  - url: https://api.water.municipality.gov.in/api/v1
    description: Production API gateway

paths:
  /auth/officer/login:
    post:
      summary: Officer authentication
      description: Authenticates an officer using municipal email credentials and issues a JWT token.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: suresh.patil@kmcwater.gov.in
                password:
                  type: string
                  format: password
                  example: StrongPassword#123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/citizen/otp/request:
    post:
      summary: Request citizen login OTP
      description: Initiates phone-based OTP authentication for citizen access.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: '9876543210'
      responses:
        '200':
          description: OTP dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      otpSent: { type: boolean, example: true }

  /auth/citizen/otp/verify:
    post:
      summary: Verify citizen OTP
      description: Validates SMS OTP and issues a citizen session JWT.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                  example: '9876543210'
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /complaints:
    get:
      summary: List complaints
      description: Returns complaints filtered by type, ward, or status.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          schema:
            type: string
          description: Optional filter query (e.g. status or category)
      responses:
        '200':
          description: List of complaints
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Complaint'
    post:
      summary: Submit complaint
      description: Files a new citizen water grievance.
      tags: [Complaints]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewComplaintRequest'
      responses:
        '201':
          description: Complaint created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Complaint'

  /complaints/{id}:
    get:
      summary: Get complaint detail (officer)
      description: >
        Officer-only complaint detail view. Roles: any officer role.
        Query shape and status vocabulary match packages/types Complaint.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Complaint detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Complaint'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Citizen tokens and other non-officer roles are rejected
        '404':
          description: Unknown complaint id
    patch:
      summary: Update complaint
      description: >
        Updates status, priority, or field assignment of a complaint.
        Roles: Admin, Supervisor, Engineer. KNOWN DRIFT: besides the
        packages/types statuses (Open, In Progress, Resolved) the endpoint
        also accepts Pending (stored as Open) and Escalated, matching the
        citizen-side vocabulary in openapi.yaml. See "Known drift" note.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Open, Pending, In Progress, Resolved, Escalated]
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                assigned:
                  type: string
      responses:
        '200':
          description: Complaint updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Complaint'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Role lacks complaint-write permission
        '404':
          description: Unknown complaint id
        '422':
          description: Validation failed (unknown enum, empty patch)

  /complaints/{id}/status:
    patch:
      summary: Update complaint status (api-client alias)
      description: >
        Alias used by @water/api-client updateStatus. Identical service and
        audit trail as PATCH /complaints/{id}. Roles: Admin, Supervisor,
        Engineer.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Open, Pending, In Progress, Resolved, Escalated]
      responses:
        '200':
          description: Complaint status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Complaint'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Role lacks complaint-write permission
        '404':
          description: Unknown complaint id
        '422':
          description: Unknown status value

  /complaints/{id}/assign:
    post:
      summary: Assign complaint to ward engineer (officer)
      description: >
        Assigns a complaint to an engineer and creates (or links) a work
        order. Roles: Admin, Supervisor.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engineer]
              properties:
                engineer: { type: string, example: 'Anil Jadhav' }
                workOrderId: { type: string }
                notes: { type: string }
      responses:
        '200':
          description: Complaint assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      complaint:
                        $ref: '#/components/schemas/Complaint'
                      workOrder:
                        $ref: '#/components/schemas/WorkOrder'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Role lacks assign permission
        '404':
          description: Unknown complaint id
        '422':
          description: Missing engineer

  /work-orders:
    get:
      summary: List field work orders
      description: Returns work orders, optionally filtered by complaint.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: complaintId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of work orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkOrder'
    post:
      summary: Create work order
      description: Creates a field task, optionally linked to a complaint.
      tags: [Complaints]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWorkOrderRequest'
      responses:
        '201':
          description: Work order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/WorkOrder'

  /work-orders/{id}:
    patch:
      summary: Update work order
      description: Updates status, assignment, or notes of a work order.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Pending, Assigned, In Progress, Completed, Cancelled]
                assignedTeam:
                  type: string
                assignedTo:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Work order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/WorkOrder'

  /supply/schedule:
    get:
      summary: Get water supply schedule
      description: Returns distribution schedules per ward and zone.
      tags: [Supply]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplyScheduleItem'
    put:
      summary: Upsert ward supply schedule row (officer)
      description: 'Roles: Admin, Supervisor, Engineer.'
      tags: [Supply]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyScheduleItem'
      responses:
        '200':
          description: Schedule row saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/SupplyScheduleItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Role lacks supply-write permission
        '422':
          description: Validation failed

  /supply/outages:
    get:
      summary: Get active and scheduled outages
      tags: [Supply]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Outage'
    post:
      summary: Create outage notice (officer)
      description: 'Roles: Admin, Supervisor, Engineer. autoNotify writes a citizen-visible alert. Dates must parse with end after start (422 otherwise).'
      tags: [Supply]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ward, zone, reason, type, startTime, estimatedRestoration]
              properties:
                ward: { type: string }
                zone: { type: string }
                reason: { type: string }
                type: { type: string, enum: [Emergency, Scheduled] }
                startTime: { type: string, example: '12 Sep 2026, 06:00 AM' }
                estimatedRestoration: { type: string, example: '12 Sep 2026, 02:00 PM' }
                status: { type: string, enum: [Active, Scheduled, Resolved] }
                affectedPopulation: { type: integer }
                tankersDispatched: { type: integer }
                autoNotify: { type: boolean }
      responses:
        '201':
          description: Outage created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      outage:
                        $ref: '#/components/schemas/Outage'
                      notification:
                        $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Role lacks supply-write permission
        '422':
          description: Validation or date error

  /supply/maintenance:
    get:
      summary: Get maintenance tasks
      tags: [Supply]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceTask'
    post:
      summary: Create maintenance activity (officer)
      description: 'Roles: Admin, Supervisor, Engineer. scheduledDate must be a parseable date (422 otherwise).'
      tags: [Supply]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type, ward, scheduledDate, assignedTeam]
              properties:
                title: { type: string }
                type: { type: string, enum: [Preventive, Corrective, Inspection] }
                ward: { type: string }
                scheduledDate: { type: string, example: '15 Sep 2026' }
                status: { type: string, enum: [Scheduled, In Progress, Completed, Pending] }
                priority: { type: string, enum: [Low, Medium, High, Critical] }
                assignedTeam: { type: string }
                notes: { type: string }
      responses:
        '201':
          description: Maintenance activity created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/MaintenanceTask'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Role lacks supply-write permission
        '422':
          description: Validation or date error

  /nrw/metrics:
    get:
      summary: Get Non-Revenue Water metrics by DMA zone
      tags: [NRW]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NRWZoneMetric'

  /nrw/leakages:
    get:
      summary: Get reported leakage telemetry incidents
      tags: [NRW]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeakageIncident'

  /citizens:
    get:
      summary: Query citizen consumer directory
      tags: [Citizens]
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CitizenRecord'

  /citizens/applications:
    get:
      summary: List new water connection applications
      tags: [Citizens]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WaterConnectionApplication'

  /citizens/requests:
    get:
      summary: List special service requests (tankers, meter tests)
      tags: [Citizens]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceRequest'
    post:
      summary: Create service request (incl. tanker bookings)
      tags: [Citizens]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewServiceRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/ServiceRequest'

  /citizens/requests/{id}:
    patch:
      summary: Update service request (assign vehicle, change status)
      tags: [Citizens]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Pending, Assigned, En Route, Completed, Cancelled]
                vehicleNumber:
                  type: string
                driverName:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/ServiceRequest'

  /billing/bills:
    get:
      summary: Get billing history for authenticated consumer
      tags: [Billing]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bill'

  /billing/usage:
    get:
      summary: Get consumption trend data points
      tags: [Billing]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageDataPoint'

  /billing/pay:
    post:
      summary: Process municipal water utility bill payment
      tags: [Billing]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billId]
              properties:
                billId: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      paid: { type: boolean, example: true }
                      transactionId: { type: string, example: 'TXN-984210' }

  /alerts:
    get:
      summary: Get active emergency notices and advisories
      description: >
        Any valid token (officer OR citizen role). Doubles as the
        notification history/log. Optional ?severity= filter.
      tags: [Alerts]
      security:
        - BearerAuth: []
      parameters:
        - name: severity
          in: query
          schema: { type: string, enum: [critical, warning, info, success] }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Broadcast emergency water alert to citizens
      description: >
        Roles: Admin, Supervisor. Accepts severity or type
        (Supply/Shortage/Flood/General, mapped to a severity).
      tags: [Alerts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAlertRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Engineer, Operator, Citizen rejected
        '422':
          description: Missing title/body, or neither severity nor type

  /notices:
    get:
      summary: List public circulars and announcements
      description: Public endpoint — no token required.
      tags: [Alerts]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notice'
    post:
      summary: Publish public notice
      tags: [Alerts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string }
                content: { type: string }
                category:
                  type: string
                  enum: [General, Tariff, Maintenance, Emergency]
                priority:
                  type: string
                  enum: [High, Normal, Low]
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Notice'

  /flood/gauges:
    get:
      summary: Get river telemetry gauge station water levels
      tags: [Flood]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GaugeStation'

  /flood/rainfall:
    get:
      summary: Get precipitation telemetry and forecast
      tags: [Flood]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RainfallData'

  /admin/officers:
    get:
      summary: List municipal staff and field operator directory
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfficerUser'
    post:
      summary: Create officer (officer)
      description: 'Roles: Admin. Seed password Password123!.'
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, role, department, zone]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                role: { type: string, enum: [Admin, Engineer, Supervisor, Operator] }
                department: { type: string }
                zone: { type: string }
      responses:
        '201':
          description: Officer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/OfficerUser'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Non-Admin role rejected
        '409':
          description: Email already exists
        '422':
          description: Validation failed

  /admin/permissions:
    get:
      summary: Get role-based access control matrix
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RolePermissions'

  /admin/settings:
    get:
      summary: Retrieve system threshold settings
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
