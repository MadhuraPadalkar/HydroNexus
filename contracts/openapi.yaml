openapi: 3.0.3
info:
  title: HydroNexus Water Management API
  version: 1.0.0
  description: >
    Production-ready REST API specification for the HydroNexus Municipal Water Management System.
    Serves both the Officer Operations Portal (port 5173) and Citizen Portal (port 5174).
servers:
  - url: http://localhost:8000/api/v1
    description: Local development backend server
  - url: https://api.water.municipality.gov.in/api/v1
    description: Production API gateway

paths:
  /auth/officer/login:
    post:
      summary: Officer authentication
      description: Authenticates an officer using municipal email credentials and issues a JWT token.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: suresh.patil@kmcwater.gov.in
                password:
                  type: string
                  format: password
                  example: StrongPassword#123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/citizen/otp/request:
    post:
      summary: Request citizen login OTP
      description: Initiates phone-based OTP authentication for citizen access.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: '9876543210'
      responses:
        '200':
          description: OTP dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      otpSent: { type: boolean, example: true }

  /auth/citizen/otp/verify:
    post:
      summary: Verify citizen OTP
      description: Validates SMS OTP and issues a citizen session JWT.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                  example: '9876543210'
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /complaints:
    get:
      summary: List complaints
      description: Returns complaints filtered by type, ward, or status.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          schema:
            type: string
          description: Optional filter query (e.g. status or category)
      responses:
        '200':
          description: List of complaints
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Complaint'
    post:
      summary: Submit complaint
      description: Files a new citizen water grievance.
      tags: [Complaints]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewComplaintRequest'
      responses:
        '201':
          description: Complaint created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Complaint'

  /complaints/{id}:
    patch:
      summary: Update complaint
      description: Updates status, priority, or field assignment of a complaint.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Pending, In Progress, Resolved, Escalated]
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                assigned:
                  type: string
      responses:
        '200':
          description: Complaint updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Complaint'

  /work-orders:
    get:
      summary: List field work orders
      description: Returns work orders, optionally filtered by complaint.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: complaintId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of work orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkOrder'
    post:
      summary: Create work order
      description: Creates a field task, optionally linked to a complaint.
      tags: [Complaints]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWorkOrderRequest'
      responses:
        '201':
          description: Work order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/WorkOrder'

  /work-orders/{id}:
    patch:
      summary: Update work order
      description: Updates status, assignment, or notes of a work order.
      tags: [Complaints]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Pending, Assigned, In Progress, Completed, Cancelled]
                assignedTeam:
                  type: string
                assignedTo:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Work order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/WorkOrder'

  /supply/schedule:
    get:
      summary: Get water supply schedule
      description: Returns distribution schedules per ward and zone.
      tags: [Supply]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplyScheduleItem'

  /supply/outages:
    get:
      summary: Get active and scheduled outages
      tags: [Supply]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Outage'
    post:
      summary: Create outage notice
      tags: [Supply]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOutageRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Outage'

  /supply/maintenance:
    get:
      summary: Get maintenance tasks
      tags: [Supply]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceTask'
    post:
      summary: Schedule maintenance task
      tags: [Supply]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMaintenanceRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/MaintenanceTask'

  /supply/maintenance/{id}:
    patch:
      summary: Update maintenance task status
      tags: [Supply]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Scheduled, In Progress, Completed, Pending, Cancelled]
                assignedTeam:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/MaintenanceTask'

  /supply/outages/{id}:
    patch:
      summary: Update outage notice
      description: Updates outage status, restoration estimate, or tanker count.
      tags: [Supply]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Active, Scheduled, Resolved]
                estimatedRestoration:
                  type: string
                tankersDispatched:
                  type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Outage'

  /nrw/metrics:
    get:
      summary: Get Non-Revenue Water metrics by DMA zone
      tags: [NRW]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NRWZoneMetric'

  /nrw/leakages:
    get:
      summary: Get reported leakage telemetry incidents
      tags: [NRW]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeakageIncident'

  /citizens:
    get:
      summary: Query citizen consumer directory
      tags: [Citizens]
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CitizenRecord'

  /citizens/applications:
    get:
      summary: List new water connection applications
      tags: [Citizens]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WaterConnectionApplication'

  /citizens/requests:
    get:
      summary: List special service requests (tankers, meter tests)
      tags: [Citizens]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceRequest'
    post:
      summary: Create service request (incl. tanker bookings)
      tags: [Citizens]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewServiceRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/ServiceRequest'

  /citizens/requests/{id}:
    patch:
      summary: Update service request (assign vehicle, change status)
      tags: [Citizens]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Pending, Assigned, En Route, Completed, Cancelled]
                vehicleNumber:
                  type: string
                driverName:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/ServiceRequest'

  /billing/bills:
    get:
      summary: Get billing history for authenticated consumer
      tags: [Billing]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bill'

  /billing/usage:
    get:
      summary: Get consumption trend data points
      tags: [Billing]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageDataPoint'

  /billing/pay:
    post:
      summary: Process municipal water utility bill payment
      tags: [Billing]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billId]
              properties:
                billId: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      paid: { type: boolean, example: true }
                      transactionId: { type: string, example: 'TXN-984210' }

  /alerts:
    get:
      summary: Get active emergency notices and advisories
      tags: [Alerts]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
    post:
      summary: Broadcast emergency water alert to citizens
      tags: [Alerts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAlertRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Alert'

  /notices:
    get:
      summary: List public circulars and announcements
      tags: [Alerts]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notice'
    post:
      summary: Publish public notice
      tags: [Alerts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string }
                content: { type: string }
                category:
                  type: string
                  enum: [General, Tariff, Maintenance, Emergency]
                priority:
                  type: string
                  enum: [High, Normal, Low]
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Notice'

  /flood/gauges:
    get:
      summary: Get river telemetry gauge station water levels
      tags: [Flood]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GaugeStation'

  /flood/rainfall:
    get:
      summary: Get precipitation telemetry and forecast
      tags: [Flood]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RainfallData'

  /admin/officers:
    get:
      summary: List municipal staff and field operator directory
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfficerUser'

  /admin/permissions:
    get:
      summary: Get role-based access control matrix
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RolePermissions'

  /admin/settings:
    get:
      summary: Retrieve system threshold settings
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/SystemSettingsConfig'

  /admin/audit-logs:
    get:
      summary: Retrieve system security and action audit trail
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Authentication token missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [message]
          properties:
            message: { type: string, example: 'Unauthorized access' }
            code: { type: string, example: 'AUTH_UNAUTHORIZED' }
            status: { type: integer, example: 401 }
            details: { type: object }

    OfficerSessionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            token: { type: string, example: 'jwt.token.string' }
            user:
              type: object
              properties:
                id: { type: string, example: 'USR-001' }
                name: { type: string, example: 'Suresh Patil' }
                role: { type: string, example: 'Admin' }
                email: { type: string, example: 'suresh.patil@kmcwater.gov.in' }
                phone: { type: string, example: '+91 98220 12345' }
                department: { type: string, example: 'Water Supply Operations' }
                zone: { type: string, example: 'Central Zone' }

    CitizenSessionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            token: { type: string, example: 'jwt.token.string' }
            user:
              type: object
              properties:
                id: { type: string, example: 'CIT-78192' }
                name: { type: string, example: 'Sunita Anand Patil' }
                role: { type: string, example: 'Citizen' }
                phone: { type: string, example: '9876543210' }
                ward: { type: string, example: 'Ward 12 - Rankala' }
                consumerId: { type: string, example: 'KMC-CON-90214' }

    Complaint:
      type: object
      required: [id, type, ward]
      properties:
        id: { type: string, example: 'CMP-2024-0891' }
        type: { type: string, example: 'Leakage' }
        citizen: { type: string, example: 'Ramesh Shinde' }
        ward: { type: string, example: 'Kasba Bawada' }
        address: { type: string, example: 'Plot 14, Sector 4, Kasba Bawada' }
        location: { type: string, example: 'Kasba Bawada Chowk' }
        phone: { type: string, example: '9876543210' }
        reported: { type: string, example: '11 Sep, 07:40' }
        date: { type: string, example: '11 Sep 2026' }
        assigned: { type: string, example: 'Anil Jadhav' }
        priority:
          type: string
          enum: [Low, Medium, High, Critical]
          example: Critical
        status:
          type: string
          enum: [Pending, In Progress, Resolved, Escalated]
          example: In Progress
        description: { type: string, example: 'Major pipeline burst near chowk' }
        updated: { type: string, example: '11 Sep, 09:00' }
        icon: { type: string, example: 'water_damage' }

    NewComplaintRequest:
      type: object
      required: [type, ward, description]
      properties:
        type: { type: string, example: 'Leakage' }
        ward: { type: string, example: 'Ward 12 - Rankala' }
        address: { type: string, example: 'Rankala Lake Road, Gate 3' }
        description: { type: string, example: 'Water overflowing from underground pipe' }
        priority: { type: string, enum: [Low, Medium, High, Critical], default: Medium }

    SupplyScheduleItem:
      type: object
      properties:
        zone: { type: string, example: 'Zone A (Rankala)' }
        morning: { type: string, example: '6:00–8:30 AM' }
        evening: { type: string, example: '6:00–8:00 PM' }
        today: { type: boolean, example: true }
        frequency: { type: string, example: 'Daily' }
        flowRate: { type: string, example: '320 L/min' }
        pressure: { type: string, example: '2.1 bar' }

    Outage:
      type: object
      properties:
        id: { type: string, example: 'OUT-101' }
        title: { type: string, example: 'Pipeline Maintenance Outage' }
        affectedAreas:
          type: array
          items: { type: string }
          example: ['Ward 10', 'Ward 11', 'Ward 12']
        startTime: { type: string, example: '12 Sep 2026, 06:00 AM' }
        estimatedEndTime: { type: string, example: '12 Sep 2026, 02:00 PM' }
        reason: { type: string, example: 'Annual valve replacement' }
        status: { type: string, enum: [Scheduled, Ongoing, Resolved], example: Scheduled }
        alternativeArrangements: { type: string, example: '3 Water tankers dispatched' }

    MaintenanceTask:
      type: object
      properties:
        id: { type: string, example: 'MNT-404' }
        facility: { type: string, example: 'Bawada Water Treatment Plant' }
        taskType: { type: string, example: 'Pump Overhaul' }
        scheduledDate: { type: string, example: '15 Sep 2026' }
        status: { type: string, enum: [Scheduled, In Progress, Completed], example: Scheduled }
        assignedTeam: { type: string, example: 'Mech Team 2' }

    NRWZoneMetric:
      type: object
      properties:
        zoneId: { type: string, example: 'DMA-01' }
        zoneName: { type: string, example: 'Kasba Bawada DMA' }
        inflowMLD: { type: number, example: 14.8 }
        billedMLD: { type: number, example: 9.6 }
        nrwPercentage: { type: number, example: 35.1 }
        targetPercentage: { type: number, example: 20.0 }
